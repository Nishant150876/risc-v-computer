name: tests

on:
  push:
  pull_request:

jobs:
  verilator:
    # ubuntu-24.04 ships Verilator 5.020, the same version used in WSL.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
          verilator --version
      - name: Run every testbench
        run: python3 scripts/run_tests.py
